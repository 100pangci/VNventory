      <path d="M237 282Q229 264 247 256L322 226Q339 219 351 234L370 259 557 706Q565 725 548 733L475 765Q451 775 435 751Z" fill="url(#left-edge)"/>
      <path d="M242 288Q236 273 252 266L326 236Q344 229 352 247L543 701Q550 716 533 723L459 755Q441 762 433 744Z" fill="url(#left-bevel)"/>
      <path d="M244 290Q238 274 253 268L326 238Q342 232 349 248L539 702Q545 715 530 722L460 752Q444 759 437 742Z" fill="url(#left-cover)"/>
      <g clip-path="url(#left-clip)">
