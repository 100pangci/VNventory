    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(209 88) rotate(48) scale(861 684)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E9CAFF" stop-opacity="0.28"/><stop offset="0.53" stop-color="#C29DEC" stop-opacity="0.07"/><stop offset="1" stop-color="#C29DEC" stop-opacity="0"/></radialGradient>
    <radialGradient id="tile-reflection" cx="0" cy="0" r="1" gradientTransform="translate(780 906) rotate(-29) scale(515 288)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#A58ADF" stop-opacity="0.12"/><stop offset="1" stop-color="#A58ADF" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile-rim" x1="195" y1="44" x2="831" y2="1002" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F3DFFF" stop-opacity="0.48"/><stop offset="0.48" stop-color="#DECAFF" stop-opacity="0.05"/><stop offset="1" stop-color="#B899EF" stop-opacity="0.22"/></linearGradient>
    <radialGradient id="cast-shadow"><stop offset="0" stop-color="#1F103B" stop-opacity="0.3"/><stop offset="0.54" stop-color="#251542" stop-opacity="0.16"/><stop offset="1" stop-color="#251542" stop-opacity="0"/></radialGradient>
    <radialGradient id="contact-shadow"><stop offset="0" stop-color="#211238" stop-opacity="0.35"/><stop offset="1" stop-color="#211238" stop-opacity="0"/></radialGradient>
    <linearGradient id="left-edge" x1="257" y1="246" x2="477" y2="768" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#DECBEE"/><stop offset="0.3" stop-color="#B395D1"/><stop offset="0.82" stop-color="#8A6BAD"/><stop offset="1" stop-color="#BA9EDA"/></linearGradient>
    <linearGradient id="left-bevel" x1="259" y1="273" x2="517" y2="729" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFF8FF"/><stop offset="0.24" stop-color="#E6D4F4"/><stop offset="0.78" stop-color="#AC90C8"/><stop offset="1" stop-color="#DBC5F0"/></linearGradient>
    <linearGradient id="left-cover" x1="281" y1="271" x2="490" y2="748" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#EFE5F7"/><stop offset="0.27" stop-color="#DECEE9"/><stop offset="0.7" stop-color="#C3ABD9"/><stop offset="1" stop-color="#A88CC6"/></linearGradient>
    <linearGradient id="left-sheen" x1="274" y1="437" x2="443" y2="366" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/><stop offset="0.34" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.86" stop-color="#FFFFFF" stop-opacity="0.13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="label" x1="277" y1="299" x2="314" y2="368" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D7C1E6"/><stop offset="1" stop-color="#F2E8F7"/></linearGradient>
    <linearGradient id="join-shadow" x1="470" y1="632" x2="509" y2="648" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#55416A" stop-opacity="0"/><stop offset="1" stop-color="#55416A" stop-opacity="0.42"/></linearGradient>
    <linearGradient id="case-edge" x1="756" y1="274" x2="565" y2="792" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#DECEE9"/><stop offset="0.16" stop-color="#B49BCC"/><stop offset="0.55" stop-color="#AA8FC7"/><stop offset="0.89" stop-color="#8B6CAE"/><stop offset="1" stop-color="#BEA6D6"/></linearGradient>
    <linearGradient id="right-bevel" x1="627" y1="232" x2="637" y2="781" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFEFA"/><stop offset="0.53" stop-color="#ECE3F3"/><stop offset="0.88" stop-color="#CBB7DF"/><stop offset="1" stop-color="#EEE1F8"/></linearGradient>
    <linearGradient id="right-cover" x1="644" y1="248" x2="567" y2="750" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFA"/><stop offset="0.38" stop-color="#F8F2F8"/><stop offset="0.74" stop-color="#E8DDF0"/><stop offset="1" stop-color="#DCCBE9"/></linearGradient>
