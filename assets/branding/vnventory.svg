    <linearGradient id="seam" x1="754" y1="331" x2="588" y2="743" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#CBBBD4" stop-opacity="0.5"/><stop offset="1" stop-color="#9D81B4" stop-opacity="0.68"/></linearGradient>
    <linearGradient id="edge-light" x1="680" y1="226" x2="801" y2="302" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFDF8"/><stop offset="0.58" stop-color="#FFFDF8" stop-opacity="0.94"/><stop offset="1" stop-color="#FFFDF8" stop-opacity="0.13"/></linearGradient>
