  <!-- All elements remain vector paths, shapes and gradients. No bitmap or filter. -->
  <g id="background-tile">
    <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
    <rect width="1024" height="1024" rx="224" fill="url(#ambient)"/>
    <rect width="1024" height="1024" rx="224" fill="url(#tile-reflection)"/>
    <rect x="2" y="2" width="1020" height="1020" rx="222" fill="none" stroke="url(#tile-rim)" stroke-width="3"/>
  </g>
  <g id="collection-mark" transform="translate(-74 -55) scale(1.12)">
    <g id="cast-shadows">
      <ellipse cx="551" cy="748" rx="179" ry="92" fill="url(#cast-shadow)"/>
      <ellipse cx="544" cy="795" rx="94" ry="29" fill="url(#contact-shadow)"/>
      <ellipse cx="675" cy="511" rx="80" ry="293" transform="rotate(23 675 511)" fill="url(#cast-shadow)"/>
      <ellipse cx="384" cy="530" rx="68" ry="258" transform="rotate(-22 384 530)" fill="url(#cast-shadow)"/>
    </g>
