      <path d="M266 300 333 273Q341 270 344 278L370 340Q373 348 365 351L299 378Q291 381 288 373L262 311Q259 303 266 300Z" fill="#A78CBB" opacity=".48"/>
      <path d="M268 302 334 276Q339 274 342 280L367 340Q370 346 363 349L299 375Q293 377 291 371L265 311Q263 304 268 302Z" fill="url(#label)"/>
      <path d="M274 314 335 289M282 333 332 313" fill="none" stroke="#967AAD" stroke-width="4.2" stroke-linecap="round"/>
