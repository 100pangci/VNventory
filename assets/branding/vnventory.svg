      <path d="M779 310 598 744Q593 756 580 757H501" fill="none" stroke="#FFF7FF" stroke-opacity=".54" stroke-width="2" stroke-linecap="round"/>
      <path d="M760 327 590 734Q585 746 573 746H502" fill="none" stroke="url(#seam)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M763 329 593 736Q588 749 574 749H503" fill="none" stroke="#FFFAFF" stroke-opacity=".66" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M486 755Q490 762 500 762H577Q594 762 600 748" fill="none" stroke="#FFF1FF" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="gold-collection-tab">
      <!-- Warm metal, with a folded lip and a restrained debossed mark. -->
      <path d="M676 225 721 244 693 315Q692 319 689 315L675 295 652 301Q647 302 649 297Z" fill="#745265" opacity=".17"/>
      <path d="M670 219 716 238 687 310Q686 314 683 310L671 292 647 298Q643 299 645 295Z" fill="url(#tab-edge)"/>
      <path d="M672 224 712 240 684 307 672 288 648 294Z" fill="url(#gold)"/>
      <path d="M670 219Q675 216 681 219L711 231Q716 233 716 238L670 219Z" fill="url(#tab-fold)"/>
      <path d="M673 224 708 238" fill="none" stroke="#FFF7DB" stroke-opacity=".84" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M653 289 672 284 683 301" fill="none" stroke="#FFE8B7" stroke-opacity=".58" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M679 246 684 255 675 260 671 251Z" fill="#C38B47" opacity=".65"/>
      <path d="M678 247 682 254 676 257 673 251Z" fill="#FFE1A9"/>
    </g>
  </g>
</svg>
