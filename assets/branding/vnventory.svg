        <path d="M644 231 701 256 580 789H465L438 730Z" fill="url(#join-shadow)"/>
      </g>
      <path d="M247 267 324 235Q337 230 344 241" fill="none" stroke="#FFF7FF" stroke-opacity=".74" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M253 287 435 722Q441 737 450 737" fill="none" stroke="#FCF1FF" stroke-opacity=".39" stroke-width="2.5" stroke-linecap="round"/>
