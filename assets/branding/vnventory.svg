<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">VNventory — The collected V</title>
  <desc id="desc">Two bevelled physical game sleeves form an ivory and lavender V. An inset spine label and a folded champagne-gold collection tab sit against a soft violet tile. Entirely vector artwork, without embedded images or fonts.</desc>
  <defs>
