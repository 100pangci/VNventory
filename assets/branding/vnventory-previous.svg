<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
    <defs>
        <linearGradient id="bg" x1="160" y1="64" x2="832" y2="960" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#302B53"/>
            <stop offset="0.55" stop-color="#201F3E"/>
            <stop offset="1" stop-color="#13192F"/>
        </linearGradient>

        <linearGradient id="cover" x1="390" y1="280" x2="690" y2="738" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#A391DF"/>
            <stop offset="0.48" stop-color="#8470C7"/>
            <stop offset="1" stop-color="#6552A5"/>
        </linearGradient>

        <linearGradient id="binding" x1="342" y1="310" x2="384" y2="710" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7965AB"/>
            <stop offset="1" stop-color="#463965"/>
        </linearGradient>

        <linearGradient id="monogram" x1="472" y1="360" x2="587" y2="626" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#EAE1FF"/>
        </linearGradient>

        <linearGradient id="gold" x1="638" y1="634" x2="729" y2="720" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#F2D59D"/>
            <stop offset="1" stop-color="#CEA05D"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <g id="Background">
        <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
        <rect x="20" y="20" width="984" height="984" rx="207"
              fill="none" stroke="#B8A6E6" stroke-opacity="0.08" stroke-width="2"/>
        </g>

        <!-- Collection: two quiet, slightly fanned sleeves -->
        <g id="Collection">
            <g transform="rotate(-11 322 528)">
                <rect x="280" y="354" width="84" height="348" rx="18" fill="#494064"/>
                <path d="M296 374V682"
                      fill="none" stroke="#796996" stroke-width="5" stroke-linecap="round"/>
                <rect x="310" y="390" width="34" height="7" rx="3.5" fill="#9C8BB7"/>
                <rect x="310" y="658" width="34" height="5" rx="2.5" fill="#756486"/>
            </g>

            <g transform="rotate(-5 364 510)">
                <rect x="316" y="306" width="96" height="410" rx="20" fill="#68558D"/>
                <path d="M331 329V691"
                      fill="none" stroke="#A38AC2" stroke-width="6" stroke-linecap="round"/>
                <rect x="346" y="349" width="43" height="8" rx="4" fill="#C3ACDF"/>
                <rect x="346" y="672" width="43" height="6" rx="3" fill="#9379AF"/>
            </g>
        </g>

        <!-- Main VN box: back shell, upper lip, binding, cover -->
        <g id="Main-VN-Box">
            <path d="M372 258
                  H655
                  Q678 258 689 279
                  L704 307
                  V706
                  Q704 731 679 736
                  L378 759
                  Q344 762 344 728
                  V296
                  Q344 270 372 258Z"
                  fill="#3E345F"/>

            <path d="M372 258
                  H655
                  Q678 258 689 279
                  L700 299
                  H379
                  L349 287
                  Q355 267 372 258Z"
                  fill="#AD96D1"/>

            <path d="M376 270
                  H654
                  Q666 270 674 280
                  H378
                  L362 285"
                  fill="none" stroke="#DDD0EE" stroke-width="4"
                  stroke-linecap="round" stroke-linejoin="round"/>

            <path d="M344 300
                  Q344 283 361 286
                  L387 294
                  V738
                  L376 746
                  Q344 755 344 725Z"
                  fill="url(#binding)"/>

            <path d="M359 310V719"
                  fill="none" stroke="#AE96D0" stroke-opacity="0.5"
                  stroke-width="4" stroke-linecap="round"/>

            <rect x="374" y="286" width="330" height="452" rx="28" fill="url(#cover)"/>

            <path d="M397 299
                  H675
                  Q691 299 691 315"
                  fill="none" stroke="#E1D4F8" stroke-opacity="0.62"
                  stroke-width="3" stroke-linecap="round"/>

            <path d="M390 710
                  Q390 724 404 724
                  H668"
                  fill="none" stroke="#4B3B7D" stroke-opacity="0.38"
                  stroke-width="3" stroke-linecap="round"/>
            </g>

            <!-- V mark: custom asymmetric shoulders and softened vertex -->
            <g id="V-Mark">
                <path d="M407 380
                      H459
                      Q467 380 470 388
                      L539 551
                      L609 372
                      Q613 362 624 362
                      H676
                      L573 612
                      Q567 628 550 628
                      H529
                      Q515 628 509 613Z"
                      fill="url(#monogram)"/>
                </g>

                <!-- Cost tag: a restrained gold accent with a punched eyelet -->
                <g id="Cost-Tag">
                    <path d="M638 632
                          H674
                          Q682 632 688 638
                          L733 683
                          Q741 691 733 699
                          L709 723
                          Q701 731 693 723
                          L638 668
                          Q632 662 632 654
                          V638
                          Q632 632 638 632Z"
                          fill="url(#gold)"
                          stroke="#594578" stroke-width="8" stroke-linejoin="round"/>

                    <path d="M643 638
                          H674
                          Q679 638 683 642
                          L728 687"
                          fill="none" stroke="#FFF0CB" stroke-opacity="0.7"
                          stroke-width="3" stroke-linecap="round"/>

                    <circle cx="652" cy="651" r="7" fill="#635080"/>

                    <path d="M684 683L700 699"
                          fill="none" stroke="#946F3F"
                          stroke-width="6" stroke-linecap="round"/>
                    </g>
                </svg>
