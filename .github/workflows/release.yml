name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: vnventory-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/toolchain/gradle-home
      ANDROID_HOME: ${{ github.workspace }}/toolchain/android-sdk
      ANDROID_USER_HOME: ${{ github.workspace }}/toolchain/android-user-home
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Android version tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python3 scripts/release.py validate-tag "$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Require release signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/release.py validate-signing

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache project Android SDK
        uses: actions/cache@v4
        with:
          path: |
            toolchain/android-sdk
            toolchain/android-user-home
            toolchain/downloads
          key: ${{ runner.os }}-android-37.2-${{ hashFiles('scripts/setup-android-env.sh') }}
          restore-keys: |
            ${{ runner.os }}-android-37.2-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare project-local Android toolchain
        id: toolchain
        run: VNVENTORY_JDK="$JAVA_HOME" scripts/setup-android-env.sh

      - name: Read reviewed release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: python3 scripts/release_notes.py --version "$VERSION" --output "$NOTES_FILE"

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_PROPERTIES_PATH: ${{ runner.temp }}/vnventory-release.properties
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/vnventory-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              result = []
              for index, char in enumerate(value):
                  code = ord(char)
                  if char == "\\":
                      result.append("\\\\")
                  elif char == "\t":
                      result.append("\\t")
                  elif char == "\n":
                      result.append("\\n")
                  elif char == "\r":
                      result.append("\\r")
                  elif char == "\f":
                      result.append("\\f")
                  elif char in "=:#!" or (char == " " and index == 0):
                      result.append("\\" + char)
                  elif code < 0x20 or code > 0x7E:
                      encoded = char.encode("utf-16-be")
                      result.extend(
                          f"\\u{int.from_bytes(encoded[pos:pos + 2], 'big'):04X}"
                          for pos in range(0, len(encoded), 2)
                      )
                  else:
                      result.append(char)
              return "".join(result)

          properties = {
              "storeFile": os.environ["RUNNER_TEMP"] + "/vnventory-release.keystore",
              "storeType": os.environ.get("ANDROID_KEYSTORE_TYPE") or "PKCS12",
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          contents = "".join(f"{key}={escape(value)}\n" for key, value in properties.items())
          properties_path = Path(os.environ["SIGNING_PROPERTIES_PATH"])
          properties_path.write_text(contents, encoding="ascii")
          properties_path.chmod(0o600)
          PY

      - name: Build release APK
        env:
          VNVENTORY_SIGNING_PROPERTIES: ${{ runner.temp }}/vnventory-release.properties
          VNVENTORY_VERSION_NAME: ${{ steps.version.outputs.name }}
          VNVENTORY_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          trap './gradlew --stop >/dev/null 2>&1 || true' EXIT
          ./gradlew --no-daemon \
            -PvnventoryVersionName="$VNVENTORY_VERSION_NAME" \
            -PvnventoryVersionCode="$VNVENTORY_VERSION_CODE" \
            :app:assembleRelease

      - name: Stop Gradle daemons
        if: always() && steps.toolchain.outcome == 'success'
        run: ./gradlew --stop

      - name: Prepare release asset
        id: asset
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk" >/dev/null
          python3 scripts/release.py prepare-apk "$VERSION_NAME" "$apk" . \
            --metadata app/build/outputs/apk/release/output-metadata.json >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VNventory ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ steps.asset.outputs.path }}
          fail_on_unmatched_files: true

      - name: Remove temporary signing files
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name in ("vnventory-release.keystore", "vnventory-release.properties"):
              (Path(os.environ["RUNNER_TEMP"]) / name).unlink(missing_ok=True)
          PY

      - name: Update CHANGELOG.md on main
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B changelog-update origin/main
          python3 scripts/update_changelog.py \
            --version "$VERSION" \
            --notes-file "$NOTES_FILE"
          git add -- CHANGELOG.md
          if git diff --cached --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already contains v${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update CHANGELOG.md for v${VERSION}"
          git push origin HEAD:main
