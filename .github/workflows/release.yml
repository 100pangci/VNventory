name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: vnventory-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/toolchain/gradle-home
      ANDROID_HOME: ${{ github.workspace }}/toolchain/android-sdk
      ANDROID_USER_HOME: ${{ github.workspace }}/toolchain/android-user-home
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache project Android SDK
        uses: actions/cache@v4
        with:
          path: |
            toolchain/android-sdk
            toolchain/android-user-home
            toolchain/downloads
          key: ${{ runner.os }}-android-37.2-${{ hashFiles('scripts/setup-android-env.sh') }}
          restore-keys: |
            ${{ runner.os }}-android-37.2-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare project-local Android toolchain
        id: toolchain
        run: VNVENTORY_JDK="$JAVA_HOME" scripts/setup-android-env.sh

      - name: Validate Android version tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["TAG_NAME"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if not match:
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"name={tag[1:]}\n")
          PY

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --field tag_name="$TAG_NAME" \
            --field target_commitish="$GITHUB_SHA" \
            --jq .body > "$NOTES_FILE"
          test -s "$NOTES_FILE"
          if ! grep -Fq "## What's Changed" "$NOTES_FILE"; then
            previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^" 2>/dev/null || true)"
            if [[ -n "$previous_tag" ]]; then
              commit_range="$previous_tag..$GITHUB_SHA"
            else
              commit_range="$GITHUB_SHA"
            fi
            commits_file="$RUNNER_TEMP/release-commits.md"
            git log --no-merges --invert-grep --grep='^docs: update CHANGELOG.md for v' \
              --format='- %s (`%h`)' "$commit_range" > "$commits_file"
            if [[ -s "$commits_file" ]]; then
              combined_file="$RUNNER_TEMP/release-notes-with-commits.md"
              {
                printf '## Changes\n\n'
                cat "$commits_file"
                printf '\n\n'
                cat "$NOTES_FILE"
              } > "$combined_file"
              mv -- "$combined_file" "$NOTES_FILE"
            fi
          fi

      - name: Check signing configuration
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            if [[ -n "$ANDROID_KEYSTORE_PASSWORD" || -n "$ANDROID_KEY_ALIAS" || -n "$ANDROID_KEY_PASSWORD" ]]; then
              echo "Release signing secrets are incomplete: ANDROID_KEYSTORE_BASE64 is missing." >&2
              exit 1
            fi
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            if [[ -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo "Release signing requires ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD." >&2
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_PROPERTIES_PATH: ${{ runner.temp }}/vnventory-release.properties
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/vnventory-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              result = []
              for index, char in enumerate(value):
                  code = ord(char)
                  if char == "\\":
                      result.append("\\\\")
                  elif char == "\t":
                      result.append("\\t")
                  elif char == "\n":
                      result.append("\\n")
                  elif char == "\r":
                      result.append("\\r")
                  elif char == "\f":
                      result.append("\\f")
                  elif char in "=:#!" or (char == " " and index == 0):
                      result.append("\\" + char)
                  elif code < 0x20 or code > 0x7E:
                      encoded = char.encode("utf-16-be")
                      result.extend(
                          f"\\u{int.from_bytes(encoded[pos:pos + 2], 'big'):04X}"
                          for pos in range(0, len(encoded), 2)
                      )
                  else:
                      result.append(char)
              return "".join(result)

          properties = {
              "storeFile": os.environ["RUNNER_TEMP"] + "/vnventory-release.keystore",
              "storeType": os.environ.get("ANDROID_KEYSTORE_TYPE") or "PKCS12",
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          contents = "".join(f"{key}={escape(value)}\n" for key, value in properties.items())
          Path(os.environ["SIGNING_PROPERTIES_PATH"]).write_text(contents, encoding="ascii")
          PY

      - name: Build release APK
        env:
          VNVENTORY_SIGNING_PROPERTIES: ${{ runner.temp }}/vnventory-release.properties
          VNVENTORY_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          trap './gradlew --stop >/dev/null 2>&1 || true' EXIT
          ./gradlew --no-daemon \
            -PvnventoryVersionName="$VNVENTORY_VERSION_NAME" \
            :app:assembleRelease

      - name: Stop Gradle daemons
        if: always() && steps.toolchain.outcome == 'success'
        run: ./gradlew --stop

      - name: Prepare release asset
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "VNventory-${TAG_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VNventory ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: VNventory-${{ github.ref_name }}.apk

      - name: Update CHANGELOG.md on main
        env:
          VERSION: ${{ steps.version.outputs.name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B changelog-update origin/main
          python3 scripts/update_changelog.py \
            --version "$VERSION" \
            --notes-file "$NOTES_FILE"
          git add -- CHANGELOG.md
          if git diff --cached --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already contains v${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update CHANGELOG.md for v${VERSION}"
          git push origin HEAD:main
