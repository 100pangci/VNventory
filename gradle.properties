# ---- Gradle ----
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 内存占用控制（本机内存紧张）：
# - daemon 空闲 60 秒自动退出
# - Kotlin 编译走进程内，避免再产生一个常驻 3G 的 Kotlin daemon
org.gradle.daemon.idletimeout=60000
kotlin.compiler.execution.strategy=in-process

# 本机 JDK 由 toolchain/gradle-home/gradle.properties 的 org.gradle.java.home 指定
# （该文件不进版本库；用 scripts/setup-android-env.sh 重建工具链时会自动写入）

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Kotlin ----
kotlin.code.style=official
